name: Generate full-history contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate 2024-2026 contribution snake SVGs
        env:
          GH_USER: AnnyaB
          START_YEAR: "2024"
          END_YEAR: "2026"
        run: |
          python - <<'PY'
          import datetime as dt
          import html
          import os
          import re
          import urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          USER = os.environ.get("GH_USER", "AnnyaB")
          START_YEAR = int(os.environ.get("START_YEAR", "2024"))
          END_YEAR = int(os.environ.get("END_YEAR", "2026"))
          TODAY = dt.date.today()

          class ContributionParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.days = {}

              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  date = a.get("data-date")
                  if not date:
                      return

                  level = a.get("data-level")
                  count = a.get("data-count")

                  if level is None:
                      classes = a.get("class", "")
                      match = re.search(r"(?:Level|level)[-_ ]?([0-4])", classes)
                      level = match.group(1) if match else "0"

                  try:
                      level_i = max(0, min(4, int(level)))
                  except (TypeError, ValueError):
                      level_i = 0

                  try:
                      count_i = max(0, int(count)) if count is not None else None
                  except (TypeError, ValueError):
                      count_i = None

                  self.days[date] = {
                      "date": date,
                      "level": level_i,
                      "count": count_i,
                  }


          def fetch_public_profile_year(year):
              start = dt.date(year, 1, 1)
              end = dt.date(year, 12, 31)

              if year == TODAY.year:
                  end = min(end, TODAY)
              elif year > TODAY.year:
                  return []

              url = (
                  f"https://github.com/users/{USER}/contributions"
                  f"?from={start.isoformat()}&to={end.isoformat()}"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": (
                          "Mozilla/5.0 "
                          f"{USER}-full-history-contribution-snake"
                      ),
                      "Accept": "text/html,application/xhtml+xml",
                  },
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  page = response.read().decode("utf-8", "replace")

              parser = ContributionParser()
              parser.feed(page)

              days = [
                  value
                  for date, value in parser.days.items()
                  if date.startswith(f"{year}-")
              ]

              if not days:
                  for tag in re.findall(r"<[^>]+data-date=[\"'][^\"']+[\"'][^>]*>", page):
                      date_match = re.search(
                          r"data-date=[\"'](\d{4}-\d{2}-\d{2})[\"']",
                          tag,
                      )
                      if not date_match:
                          continue

                      date = date_match.group(1)
                      if not date.startswith(f"{year}-"):
                          continue

                      level_match = re.search(
                          r"data-level=[\"']([0-4])[\"']",
                          tag,
                      )
                      level = int(level_match.group(1)) if level_match else 0

                      parser.days[date] = {
                          "date": date,
                          "level": level,
                          "count": None,
                      }

                  days = [
                      value
                      for date, value in parser.days.items()
                      if date.startswith(f"{year}-")
                  ]

              expected_min = 300 if year < TODAY.year else max(
                  1, (end - start).days + 1
              )

              if len(days) < min(expected_min, 300):
                  raise RuntimeError(
                      f"Only parsed {len(days)} contribution days for {year}; "
                      "GitHub contribution markup may have changed."
                  )

              return sorted(days, key=lambda item: item["date"])


          def all_dates_for_year(year):
              start = dt.date(year, 1, 1)
              end = dt.date(year, 12, 31)

              if year == TODAY.year:
                  end = min(end, TODAY)
              elif year > TODAY.year:
                  return []

              result = []
              current = start
              while current <= end:
                  result.append(current)
                  current += dt.timedelta(days=1)
              return result


          years = {}

          for year in range(START_YEAR, END_YEAR + 1):
              print(f"Fetching public profile contribution graph for {year}...")
              fetched = fetch_public_profile_year(year)
              fetched_by_date = {item["date"]: item for item in fetched}

              complete = []
              for day in all_dates_for_year(year):
                  key = day.isoformat()
                  complete.append(
                      fetched_by_date.get(
                          key,
                          {"date": key, "level": 0, "count": None},
                      )
                  )

              years[year] = complete
              active_days = sum(day["level"] > 0 for day in complete)
              print(
                  f"{year}: {len(complete)} calendar days, "
                  f"{active_days} contribution days."
              )


          CELL = 10
          GAP = 3
          PITCH = CELL + GAP
          LEFT = 58
          TOP = 26
          YEAR_GAP = 34
          GRID_HEIGHT = 7 * PITCH
          ROW_HEIGHT = GRID_HEIGHT + YEAR_GAP
          MAX_WEEKS = 54
          WIDTH = LEFT + MAX_WEEKS * PITCH + 16
          HEIGHT = TOP + len(years) * ROW_HEIGHT + 8

          # Keep approximately the same per-cell pace as the original snk
          # animation instead of forcing three years into one short loop.
          STEP_SECONDS = 0.10
          SNAKE_PARTS = 8


          def github_weekday(date_obj):
              # Python Monday=0..Sunday=6; GitHub Sunday=0..Saturday=6.
              return (date_obj.weekday() + 1) % 7


          def layout_year(year, days, row):
              jan1 = dt.date(year, 1, 1)
              grid_start = jan1 - dt.timedelta(days=github_weekday(jan1))
              y0 = TOP + row * ROW_HEIGHT

              cells = []
              weeks = {}

              for item in days:
                  date_obj = dt.date.fromisoformat(item["date"])
                  week = (date_obj - grid_start).days // 7
                  weekday = github_weekday(date_obj)

                  cell = {
                      **item,
                      "week": week,
                      "weekday": weekday,
                      "x": LEFT + week * PITCH,
                      "y": y0 + weekday * PITCH,
                  }
                  cells.append(cell)
                  weeks.setdefault(week, []).append(cell)

              # Visit every single calendar cell exactly once in a continuous
              # serpentine route. Adjacent cells stay one grid-step apart.
              route = []
              for week in sorted(weeks):
                  column = sorted(weeks[week], key=lambda cell: cell["weekday"])
                  if week % 2:
                      column.reverse()
                  route.extend(column)

              return y0, cells, route


          layouts = {}
          route_cells = []

          for row, (year, days) in enumerate(years.items()):
              y0, cells, route = layout_year(year, days, row)
              layouts[year] = (y0, cells)
              route_cells.extend(route)

          if not route_cells:
              raise RuntimeError("No contribution calendar cells were generated.")

          # Every point is the exact centre of one calendar square. The SVG
          # animation below uses discrete keyframes, so the snake visibly lands
          # on every cell rather than interpolating rapidly past them.
          points = [
              (cell["x"] + CELL / 2, cell["y"] + CELL / 2)
              for cell in route_cells
          ]

          route_index = {
              cell["date"]: index
              for index, cell in enumerate(route_cells)
          }

          total_steps = len(points)
          DURATION = total_steps * STEP_SECONDS


          def animation_values(offset):
              values = []
              for i in range(total_steps):
                  source = max(0, i - offset)
                  x, y = points[source]
                  values.append(f"{x:.1f} {y:.1f}")
              # Close the animation cleanly at the end of the loop.
              values.append(values[-1])
              return ";".join(values)


          def animation_key_times():
              # One keyframe per cell, giving equal time to every grid square.
              if total_steps <= 1:
                  return "0;1"
              return ";".join(
                  f"{i / total_steps:.7f}"
                  for i in range(total_steps + 1)
              )


          KEY_TIMES = animation_key_times()


          def render(theme):
              if theme == "dark":
                  dot_colors = [
                      "#161b22",
                      "#01311f",
                      "#034525",
                      "#0f6d31",
                      "#00c647",
                  ]
                  text_color = "#8b949e"
                  snake_color = "purple"
              else:
                  dot_colors = [
                      "#ebedf0",
                      "#9be9a8",
                      "#40c463",
                      "#30a14e",
                      "#216e39",
                  ]
                  text_color = "#57606a"
                  snake_color = "purple"

              out = [
                  (
                      f'<svg xmlns="http://www.w3.org/2000/svg" '
                      f'width="{WIDTH}" height="{HEIGHT}" '
                      f'viewBox="0 0 {WIDTH} {HEIGHT}" '
                      f'role="img" '
                      f'aria-label="{html.escape(USER)} GitHub contributions '
                      f'from {START_YEAR} to {END_YEAR}">'
                  ),
                  (
                      f"<title>{html.escape(USER)} GitHub contribution snake, "
                      f"{START_YEAR}-{END_YEAR}</title>"
                  ),
                  (
                      "<style>"
                      "text{font-family:-apple-system,BlinkMacSystemFont,"
                      "'Segoe UI',sans-serif;font-size:14px;font-weight:600}"
                      ".snake{shape-rendering:geometricPrecision}"
                      "</style>"
                  ),
              ]

              for year, (y0, cells) in layouts.items():
                  out.append(
                      f'<text x="0" y="{y0 + 8}" fill="{text_color}" '
                      f'dominant-baseline="middle">{year}</text>'
                  )

                  for cell in cells:
                      level = max(0, min(4, int(cell["level"])))
                      color = dot_colors[level]
                      out.append(
                          f'<rect x="{cell["x"]}" y="{cell["y"]}" '
                          f'width="{CELL}" height="{CELL}" rx="2" '
                          f'fill="{color}">'
                      )

                      if level > 0:
                          index = route_index[cell["date"]]
                          eat = index * STEP_SECONDS
                          # Leave the square eaten long enough to be noticeable,
                          # then restore it before the next full loop.
                          out.append(
                              f'<animate attributeName="opacity" '
                              f'values="1;1;0;0;1" '
                              f'keyTimes="0;{max(0.0, eat / DURATION - 0.00001):.7f};'
                              f'{eat / DURATION:.7f};0.9850000;1" '
                              f'dur="{DURATION:.2f}s" repeatCount="indefinite"/>'
                          )

                      out.append("</rect>")

              # Rounded, tapered pixel body closely matches the friendly look
              # of Platane/snk: a large rounded head with progressively smaller
              # rounded body pieces, rather than a chain of identical circles.
              sizes = [9.2, 8.8, 8.2, 7.5, 6.8, 6.2, 5.7, 5.2]

              for part in range(SNAKE_PARTS - 1, -1, -1):
                  size = sizes[part]
                  x0 = -size / 2
                  y0 = -size / 2
                  radius = min(4.5, size * 0.42)
                  values = animation_values(part)

                  out.append(
                      f'<rect class="snake" x="{x0:.2f}" y="{y0:.2f}" '
                      f'width="{size:.2f}" height="{size:.2f}" '
                      f'rx="{radius:.2f}" ry="{radius:.2f}" '
                      f'fill="{snake_color}">'
                      f'<animateTransform attributeName="transform" '
                      f'attributeType="XML" type="translate" '
                      f'values="{values}" keyTimes="{KEY_TIMES}" '
                      f'calcMode="discrete" dur="{DURATION:.2f}s" '
                      f'repeatCount="indefinite"/>'
                      '</rect>'
                  )

              out.append("</svg>")
              return "".join(out)


          Path("dist").mkdir(exist_ok=True)

          # Preserve the filenames already referenced by README.md so nothing
          # outside this workflow needs to change.
          Path("dist/github-contribution-grid-snake.svg").write_text(
              render("light"),
              encoding="utf-8",
          )
          Path("dist/github-contribution-grid-snake-dark.svg").write_text(
              render("dark"),
              encoding="utf-8",
          )

          print(
              f"Generated full-history contribution snake for "
              f"{START_YEAR}-{END_YEAR}: {total_steps} visited cells, "
              f"{DURATION:.1f}s per loop ({STEP_SECONDS:.2f}s per cell)."
          )
          PY

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
