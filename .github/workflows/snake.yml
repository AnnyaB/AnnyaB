name: Generate full-history contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate 2024-2026 contribution snake SVGs
        env:
          GH_USER: AnnyaB
          START_YEAR: "2024"
          END_YEAR: "2026"
        run: |
          python - <<'PY'
          import datetime as dt
          import html
          import os
          import re
          import urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          USER = os.environ.get("GH_USER", "AnnyaB")
          START_YEAR = int(os.environ.get("START_YEAR", "2024"))
          END_YEAR = int(os.environ.get("END_YEAR", "2026"))
          TODAY = dt.date.today()

          class ContributionParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.days = {}

              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  date = a.get("data-date")
                  if not date:
                      return

                  level = a.get("data-level")
                  count = a.get("data-count")

                  if level is None:
                      classes = a.get("class", "")
                      match = re.search(r"(?:Level|level)[-_ ]?([0-4])", classes)
                      level = match.group(1) if match else "0"

                  try:
                      level_i = max(0, min(4, int(level)))
                  except (TypeError, ValueError):
                      level_i = 0

                  try:
                      count_i = max(0, int(count)) if count is not None else None
                  except (TypeError, ValueError):
                      count_i = None

                  self.days[date] = {
                      "date": date,
                      "level": level_i,
                      "count": count_i,
                  }


          def fetch_public_profile_year(year):
              start = dt.date(year, 1, 1)
              end = dt.date(year, 12, 31)

              if year == TODAY.year:
                  end = min(end, TODAY)
              elif year > TODAY.year:
                  return []

              url = (
                  f"https://github.com/users/{USER}/contributions"
                  f"?from={start.isoformat()}&to={end.isoformat()}"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": (
                          "Mozilla/5.0 "
                          f"{USER}-full-history-contribution-snake"
                      ),
                      "Accept": "text/html,application/xhtml+xml",
                  },
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  page = response.read().decode("utf-8", "replace")

              parser = ContributionParser()
              parser.feed(page)

              days = [
                  value
                  for date, value in parser.days.items()
                  if date.startswith(f"{year}-")
              ]

              if not days:
                  for tag in re.findall(
                      r"<[^>]+data-date=[\"'][^\"']+[\"'][^>]*>",
                      page,
                  ):
                      date_match = re.search(
                          r"data-date=[\"'](\d{4}-\d{2}-\d{2})[\"']",
                          tag,
                      )
                      if not date_match:
                          continue

                      date = date_match.group(1)
                      if not date.startswith(f"{year}-"):
                          continue

                      level_match = re.search(
                          r"data-level=[\"']([0-4])[\"']",
                          tag,
                      )
                      level = int(level_match.group(1)) if level_match else 0

                      parser.days[date] = {
                          "date": date,
                          "level": level,
                          "count": None,
                      }

                  days = [
                      value
                      for date, value in parser.days.items()
                      if date.startswith(f"{year}-")
                  ]

              expected_min = 300 if year < TODAY.year else max(
                  1, (end - start).days + 1
              )

              if len(days) < min(expected_min, 300):
                  raise RuntimeError(
                      f"Only parsed {len(days)} contribution days for {year}; "
                      "GitHub contribution markup may have changed."
                  )

              return sorted(days, key=lambda item: item["date"])


          def all_dates_for_year(year):
              start = dt.date(year, 1, 1)
              end = dt.date(year, 12, 31)

              if year == TODAY.year:
                  end = min(end, TODAY)
              elif year > TODAY.year:
                  return []

              result = []
              current = start
              while current <= end:
                  result.append(current)
                  current += dt.timedelta(days=1)
              return result


          years = {}

          for year in range(START_YEAR, END_YEAR + 1):
              print(f"Fetching public profile contribution graph for {year}...")
              fetched = fetch_public_profile_year(year)
              fetched_by_date = {item["date"]: item for item in fetched}

              complete = []
              for day in all_dates_for_year(year):
                  key = day.isoformat()
                  complete.append(
                      fetched_by_date.get(
                          key,
                          {"date": key, "level": 0, "count": None},
                      )
                  )

              years[year] = complete
              active_days = sum(day["level"] > 0 for day in complete)
              print(
                  f"{year}: {len(complete)} calendar days, "
                  f"{active_days} contribution days."
              )


          # Match the original Platane/snk grid geometry closely.
          PITCH = 16
          DOT = 12
          LEFT = 48
          TOP = 32
          GRID_HEIGHT = 7 * PITCH
          YEAR_GAP = 32
          ROW_HEIGHT = GRID_HEIGHT + YEAR_GAP
          MAX_WEEKS = 54
          WIDTH = LEFT + MAX_WEEKS * PITCH + 16
          HEIGHT = TOP + len(years) * ROW_HEIGHT + 8

          # Keep the same calm motion speed as the working version.
          STEP_SECONDS = 0.12


          def github_weekday(date_obj):
              return (date_obj.weekday() + 1) % 7


          def layout_year(year, days, row):
              jan1 = dt.date(year, 1, 1)
              grid_start = jan1 - dt.timedelta(days=github_weekday(jan1))
              y0 = TOP + row * ROW_HEIGHT

              cells = []
              for item in days:
                  date_obj = dt.date.fromisoformat(item["date"])
                  week = (date_obj - grid_start).days // 7
                  weekday = github_weekday(date_obj)

                  cells.append(
                      {
                          **item,
                          "week": week,
                          "weekday": weekday,
                          "px": LEFT + week * PITCH,
                          "py": y0 + weekday * PITCH,
                          "x": LEFT + week * PITCH + 2,
                          "y": y0 + weekday * PITCH + 2,
                      }
                  )

              return y0, cells


          layouts = {}
          active_by_year = {}

          for row, (year, days) in enumerate(years.items()):
              y0, cells = layout_year(year, days, row)
              layouts[year] = (y0, cells)

              active = [cell for cell in cells if int(cell["level"]) > 0]
              active.sort(
                  key=lambda cell: (
                      cell["week"],
                      cell["weekday"]
                      if cell["week"] % 2 == 0
                      else -cell["weekday"],
                  )
              )
              active_by_year[year] = active


          def walk_to(route, destination):
              if not route:
                  route.append(destination)
                  return

              x, y = route[-1]
              dx, dy = destination

              while x != dx:
                  x += PITCH if dx > x else -PITCH
                  route.append((x, y))

              while y != dy:
                  y += PITCH if dy > y else -PITCH
                  route.append((x, y))


          route = []
          first_y0 = layouts[START_YEAR][0]
          start_point = (LEFT - PITCH, first_y0 - PITCH)
          route.append(start_point)

          first_visit = {}

          for year in range(START_YEAR, END_YEAR + 1):
              y0, _ = layouts[year]
              year_entry = (LEFT - PITCH, y0 - PITCH)
              walk_to(route, year_entry)

              active_positions = {
                  (cell["px"], cell["py"]): cell
                  for cell in active_by_year[year]
              }

              for target in active_by_year[year]:
                  target_point = (target["px"], target["py"])
                  before = len(route)
                  walk_to(route, target_point)

                  for idx in range(before, len(route)):
                      pos = route[idx]
                      if pos in active_positions:
                          date = active_positions[pos]["date"]
                          first_visit.setdefault(date, idx)

              walk_to(route, (LEFT - PITCH, y0 + GRID_HEIGHT))

          for year in range(START_YEAR, END_YEAR + 1):
              for cell in active_by_year[year]:
                  if cell["date"] not in first_visit:
                      walk_to(route, (cell["px"], cell["py"]))
                      first_visit[cell["date"]] = len(route) - 1

          last_y = route[-1][1]
          walk_to(route, (LEFT - PITCH, last_y))
          walk_to(route, start_point)

          compact_route = [route[0]]
          for point in route[1:]:
              if point != compact_route[-1]:
                  compact_route.append(point)
          route = compact_route

          position_to_dates = {}
          for year in range(START_YEAR, END_YEAR + 1):
              for cell in active_by_year[year]:
                  position_to_dates.setdefault(
                      (cell["px"], cell["py"]),
                      [],
                  ).append(cell["date"])

          first_visit = {}
          for index, point in enumerate(route):
              for date in position_to_dates.get(point, []):
                  first_visit.setdefault(date, index)

          missing = [
              date
              for dates in position_to_dates.values()
              for date in dates
              if date not in first_visit
          ]
          if missing:
              raise RuntimeError(
                  f"Bunny route missed {len(missing)} contribution cells."
              )

          total_steps = len(route)
          duration_ms = int(total_steps * STEP_SECONDS * 1000)


          def pct(index):
              return 100.0 * index / max(1, total_steps - 1)


          def direction_angle(index):
              x, y = route[index]
              n = len(route)

              for offset in range(1, n + 1):
                  nx, ny = route[(index + offset) % n]
                  dx = nx - x
                  dy = ny - y

                  if dx > 0:
                      return 0
                  if dx < 0:
                      return 180
                  if dy > 0:
                      return 90
                  if dy < 0:
                      return -90

              return 0


          def bunny_keyframes():
              pieces = []

              for i, (x, y) in enumerate(route):
                  angle = direction_angle(i)
                  cx = x + PITCH / 2
                  cy = y + PITCH / 2
                  pieces.append(
                      f"{pct(i):.3f}%"
                      f"{{transform:translate({cx:.1f}px,{cy:.1f}px) "
                      f"rotate({angle}deg)}}"
                  )

              return "".join(pieces)


          def render(theme):
              if theme == "dark":
                  dot_colors = [
                      "#161b22",
                      "#01311f",
                      "#034525",
                      "#0f6d31",
                      "#00c647",
                  ]
                  empty = "#161b22"
                  text_color = "#8b949e"
                  eye_pupil = "#1f1028"
              else:
                  dot_colors = [
                      "#ebedf0",
                      "#9be9a8",
                      "#40c463",
                      "#30a14e",
                      "#216e39",
                  ]
                  empty = "#ebedf0"
                  text_color = "#57606a"
                  eye_pupil = "#2b1735"

              styles = [
                  ":root{",
                  "--cb:#1b1f230a;",
                  "--cs:purple;",
                  "--ear:#ffb6dc;",
                  "--cheek:#ff8fc7;",
                  "--eye:#ffffff;",
                  f"--pupil:{eye_pupil};",
                  f"--ce:{empty};",
                  *[
                      f"--c{i}:{color};"
                      for i, color in enumerate(dot_colors)
                  ],
                  "}",
                  (
                      f".c{{shape-rendering:geometricPrecision;"
                      f"fill:var(--ce);stroke-width:1px;stroke:var(--cb);"
                      f"width:{DOT}px;height:{DOT}px}}"
                  ),
                  (
                      f".bunny{{shape-rendering:geometricPrecision;"
                      f"animation:bunnyMove {duration_ms}ms linear infinite;"
                      f"transform-origin:0 0}}"
                  ),
                  (
                      ".mouth{transform-origin:1px 0px;"
                      "animation:chomp 360ms ease-in-out infinite}"
                  ),
                  (
                      "@keyframes chomp{"
                      "0%,100%{transform:scaleY(.28)}"
                      "50%{transform:scaleY(1)}}"
                  ),
                  f"@keyframes bunnyMove{{{bunny_keyframes()}}}",
              ]

              cell_class = {}
              class_index = 0

              for year in range(START_YEAR, END_YEAR + 1):
                  _, cells = layouts[year]
                  for cell in cells:
                      level = max(0, min(4, int(cell["level"])))
                      if level <= 0:
                          continue

                      visit = first_visit[cell["date"]]
                      t = pct(visit)
                      before = max(0.0, t - 0.015)
                      after = min(100.0, t + 0.015)
                      class_name = f"c{class_index:x}"
                      class_index += 1
                      cell_class[cell["date"]] = class_name

                      styles.append(
                          f"@keyframes {class_name}{{"
                          f"{before:.3f}%{{fill:var(--c{level})}}"
                          f"{after:.3f}%,100%{{fill:var(--ce)}}"
                          f"}}"
                          f".c.{class_name}{{"
                          f"fill:var(--c{level});"
                          f"animation:{class_name} "
                          f"{duration_ms}ms linear infinite"
                          f"}}"
                      )

              out = [
                  (
                      f'<svg viewBox="0 0 {WIDTH} {HEIGHT}" '
                      f'width="{WIDTH}" height="{HEIGHT}" '
                      f'xmlns="http://www.w3.org/2000/svg" '
                      f'role="img" '
                      f'aria-label="{html.escape(USER)} GitHub contributions '
                      f'from {START_YEAR} to {END_YEAR}">'
                  ),
                  (
                      f"<title>{html.escape(USER)} GitHub contribution animation, "
                      f"{START_YEAR}-{END_YEAR}</title>"
                  ),
                  "<desc>Full-history contribution grid with a chomping bunny</desc>",
                  "<style>",
                  "".join(styles),
                  (
                      "text{font-family:-apple-system,BlinkMacSystemFont,"
                      "'Segoe UI',sans-serif;font-size:14px;font-weight:600}"
                  ),
                  "</style>",
              ]

              for year in range(START_YEAR, END_YEAR + 1):
                  y0, cells = layouts[year]
                  out.append(
                      f'<text x="0" y="{y0 + 8}" fill="{text_color}" '
                      f'dominant-baseline="middle">{year}</text>'
                  )

                  for cell in cells:
                      klass = "c"
                      if cell["date"] in cell_class:
                          klass += " " + cell_class[cell["date"]]

                      out.append(
                          f'<rect class="{klass}" '
                          f'x="{cell["x"]}" y="{cell["y"]}" '
                          f'rx="2" ry="2"/>'
                      )

              start_angle = direction_angle(0)
              start_cx = route[0][0] + PITCH / 2
              start_cy = route[0][1] + PITCH / 2

              out.extend(
                  [
                      (
                          f'<g class="bunny" style="transform:translate('
                          f'{start_cx:.1f}px,{start_cy:.1f}px) '
                          f'rotate({start_angle}deg)">'
                      ),
                      # Two long bunny ears.
                      '<ellipse cx="-4.2" cy="-11.5" rx="3.0" ry="7.2" '
                      'fill="var(--cs)" transform="rotate(-11 -4.2 -11.5)"/>',
                      '<ellipse cx="2.0" cy="-11.8" rx="3.0" ry="7.2" '
                      'fill="var(--cs)" transform="rotate(10 2 -11.8)"/>',
                      '<ellipse cx="-4.2" cy="-11.5" rx="1.25" ry="4.7" '
                      'fill="var(--ear)" transform="rotate(-11 -4.2 -11.5)"/>',
                      '<ellipse cx="2.0" cy="-11.8" rx="1.25" ry="4.7" '
                      'fill="var(--ear)" transform="rotate(10 2 -11.8)"/>',
                      # Round Pac-Man-like rabbit face.
                      '<circle cx="0" cy="0" r="8.4" fill="var(--cs)"/>',
                      # Cute eye and pupil.
                      '<ellipse cx="2.1" cy="-3.0" rx="2.0" ry="2.3" '
                      'fill="var(--eye)"/>',
                      '<circle cx="2.8" cy="-3.0" r="0.85" fill="var(--pupil)"/>',
                      # Blush cheek.
                      '<ellipse cx="1.5" cy="3.6" rx="1.8" ry="1.1" '
                      'fill="var(--cheek)" opacity="0.9"/>',
                      # Animated Pac-Man mouth: the background-coloured wedge
                      # opens and closes while contribution squares disappear.
                      '<path class="mouth" d="M 1 0 L 9 -5.2 L 9 5.2 Z" '
                      'fill="var(--ce)"/>',
                      # Tiny rabbit tooth at the mouth edge.
                      '<rect x="5.7" y="-1.1" width="2.1" height="1.7" '
                      'rx="0.35" fill="var(--eye)"/>',
                      '</g>',
                  ]
              )

              out.append("</svg>")
              return "".join(out)


          Path("dist").mkdir(exist_ok=True)

          # Keep the filenames already used by README.md unchanged.
          Path("dist/github-contribution-grid-snake.svg").write_text(
              render("light"),
              encoding="utf-8",
          )
          Path("dist/github-contribution-grid-snake-dark.svg").write_text(
              render("dark"),
              encoding="utf-8",
          )

          active_total = sum(len(v) for v in active_by_year.values())
          print(
              f"Generated chomping bunny for "
              f"{START_YEAR}-{END_YEAR}: "
              f"{active_total} contribution cells covered, "
              f"{total_steps} adjacent movement steps, "
              f"{duration_ms / 1000:.1f}s per loop."
          )
          PY

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
